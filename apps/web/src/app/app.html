<div class="shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">{{ 'app.eyebrow' | translate }}</p>
      <h1>{{ 'app.title' | translate }}</h1>
    </div>
    <div class="topbar__aside">
      <div class="topbar__controls">
        <app-theme-switch />
        <app-language-switch />
      </div>
      <p class="hint">{{ 'app.hint' | translate }}</p>
    </div>
  </header>

  <app-paper-account />

  <main class="layout">
    <div class="stack">
      <app-market-board />
      <app-trade-history />
    </div>
    <div class="stack">
      <app-price-scene />
      <app-btc-chart />
    </div>
  </main>
</div>

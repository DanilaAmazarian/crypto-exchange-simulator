name: crypto-exchange-simulator

services:
  api:
    build:
      context: ./apps/api
    image: crypto-exchange-simulator-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    image: crypto-exchange-simulator-web
    ports:
      - "4200:80"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      MARKET_SOCKET_URL: ${MARKET_SOCKET_URL:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

name: Test and deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Test the API
        working-directory: apps/api
        run: |
          npm ci
          npm test
      - name: Test the web app
        working-directory: apps/web
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild containers on the server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null; then
            echo "SSH_KEY is not a readable private key. Save the private file, not the .pub, including the BEGIN and END lines."
            exit 1
          fi
          remote="set -eu; cd /root/projects/crypto-exchange-simulator; git pull --ff-only; docker compose up --build -d"
          attempt=1
          while true; do
            set +e
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "root@${SSH_HOST}" "$remote"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$status" -ne 255 ] || [ "$attempt" -ge 5 ]; then
              exit "$status"
            fi
            echo "SSH connection was reset, retry ${attempt} of 5"
            attempt=$((attempt + 1))
            sleep 20
          done
